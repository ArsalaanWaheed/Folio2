services:
  - type: web
    name: zuberia-folio
    runtime: node
    branch: main
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORTFOLIO_DATA_FILE
        value: /var/data/portfolio.json
      - key: PORTFOLIO_ADMIN_PASSWORD
        sync: false
